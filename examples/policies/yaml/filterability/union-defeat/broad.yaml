apiVersion: tracee.aquasec.com/v1beta1
kind: Policy
metadata:
  name: broad-openat
  annotations:
    description: >
      The other half of the union-defeat demo: openat selected with no kernel filter. Because Tracee
      runs one shared event stream, a single broad selector forces the kernel to submit EVERY openat -
      defeating the kernel scope in scoped.yaml. Analyze the directory together:
      `tracee list filterable union-defeat/` reports:
      [user-space] openat
        kernel filters defeated here: comm
        submitted to user space by: broad-openat (no filter)
        tip: broad-openat selects this event with no filter, forcing submission of
        EVERY instance for all policies - adding a workload scope
        (comm/uid/container/executable/...) or a pathname data filter there restores
        kernel gating for everyone
spec:
  scope:
    - global
  rules:
    - event: openat
