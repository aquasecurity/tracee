name: Run Unit Tests
description: |
  Run comprehensive unit test suite including main unit tests and script tests.
runs:
  using: composite
  steps:
    - name: Run Full Unit Test Suite
      run: |
        # every internal Go module: main pkgs + the types/common/detectors/api/
        # traceectl submodules (tests-unit = test-unit + tests-submodules)
        make tests-unit
      shell: sh
    - name: Run Scripts Unit Tests
      run: |
        make run-scripts-test-unit
      shell: sh
