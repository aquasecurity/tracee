name: Build Tracee Build Environment
description: |
  Restore the tracee-buildenv image from the actions cache, or build it via
  'make image' (or 'make image-vm' when vm=true) and cache it for other jobs.
  The image is local-only (never pushed to a registry); the cache key changes
  whenever the Containerfile or an installation script changes, and the make
  target independently verifies the image content hash label, so a stale restore
  can never be used.
inputs:
  distro:
    description: "Build environment distro (alpine|ubuntu)"
    required: false
    default: "alpine"
  vm:
    description: |
      Build/cache the VM-capable ubuntu-vm image ('make image-vm') instead of a
      plain dev image. Downloading the cached image is far cheaper than the
      firecracker+qemu+tooling build, and the vm image rarely drifts.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Compute cache key
      id: key
      shell: bash
      run: |
        # uid is part of the key: it is baked into the image as a build arg
        # (GitHub-hosted runners are non-root, GRAAS AMIs run as root)
        hash="${{ hashFiles('builder/Containerfile', 'scripts/lib*.sh', 'scripts/installation/**') }}"
        if [ "${{ inputs.vm }}" = "true" ]; then
          # the vm image is arch-native and always ubuntu-based; a separate key
          # namespace ('vm') keeps it distinct from the plain dev-image entries
          echo "key=buildenv-vm-${{ runner.os }}-${{ runner.arch }}-$(id -u)-${hash}" >> "${GITHUB_OUTPUT}"
          echo "tarball=/tmp/tracee-buildenv-ubuntu-vm.tar.zst" >> "${GITHUB_OUTPUT}"
          echo "tag=tracee-buildenv:ubuntu-vm" >> "${GITHUB_OUTPUT}"
          echo "build=make image-vm" >> "${GITHUB_OUTPUT}"
        else
          echo "key=buildenv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.distro }}-$(id -u)-${hash}" >> "${GITHUB_OUTPUT}"
          echo "tarball=/tmp/tracee-buildenv-${{ inputs.distro }}.tar.zst" >> "${GITHUB_OUTPUT}"
          echo "tag=tracee-buildenv:${{ inputs.distro }}" >> "${GITHUB_OUTPUT}"
          echo "build=make image DISTRO=${{ inputs.distro }}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Restore image from cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.tarball }}
        key: ${{ steps.key.outputs.key }}

    - name: Load cached image
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        engine=$(command -v docker > /dev/null 2>&1 && echo docker || echo podman)
        zstd -d --stdout "${{ steps.key.outputs.tarball }}" | ${engine} load
        rm -f "${{ steps.key.outputs.tarball }}"

    - name: Build image
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ${{ steps.key.outputs.build }}

    - name: Save image for cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        engine=$(command -v docker > /dev/null 2>&1 && echo docker || echo podman)
        ${engine} save ${{ steps.key.outputs.tag }} | zstd -T0 > "${{ steps.key.outputs.tarball }}"

    - name: Save image to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.tarball }}
        key: ${{ steps.key.outputs.key }}

    - name: Clean up tarball
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -f "${{ steps.key.outputs.tarball }}"
