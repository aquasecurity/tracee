name: Run E2E Tests
description: |
  Run end-to-end tests including compatibility, core, network, and kernel tests.
  Build dependencies are handled automatically by make rules.
  Handles test failure detection and artifact uploads.
inputs:
  job-name:
    description: 'Job name for artifact naming'
    required: true
  run-id:
    description: 'GitHub run ID for artifact naming'
    required: true
  run-attempt:
    description: 'GitHub run attempt for artifact naming'
    required: true
runs:
  using: composite
  steps:
    - name: Compatibility Test
      run: env "PATH=${PATH}" make test-compatibility
      shell: bash
    - name: E2E Test (Core and Extended)
      id: e2e-test
      run: |
        make test-e2e E2E_ARGS="--keep-artifacts" 2>&1 | tee /tmp/e2e-test.log
        exit ${PIPESTATUS[0]}
      shell: bash
    - name: E2E Network Test
      id: e2e-net-test
      run: |
        make test-e2e-net E2E_ARGS="--keep-artifacts" 2>&1 | tee /tmp/e2e-test-net.log
        exit ${PIPESTATUS[0]}
      shell: bash
    - name: E2E Kernel Test
      id: e2e-kernel-test
      run: |
        make test-e2e-kernel E2E_ARGS="--keep-artifacts" 2>&1 | tee /tmp/e2e-test-kernel.log
        exit ${PIPESTATUS[0]}
      shell: bash
    - name: Determine Failed Test
      id: failed-test
      if: failure() && (
        steps.e2e-test.conclusion == 'failure' ||
        steps.e2e-net-test.conclusion == 'failure' ||
        steps.e2e-kernel-test.conclusion == 'failure'
        )
      env:
        E2E_CONCLUSION: ${{ steps.e2e-test.conclusion }}
        NET_CONCLUSION: ${{ steps.e2e-net-test.conclusion }}
        KERNEL_CONCLUSION: ${{ steps.e2e-kernel-test.conclusion }}
      run: |
        if [ "${E2E_CONCLUSION}" = "failure" ]; then
            echo "name=e2e" >> "${GITHUB_OUTPUT}"
        elif [ "${NET_CONCLUSION}" = "failure" ]; then
            echo "name=net" >> "${GITHUB_OUTPUT}"
        elif [ "${KERNEL_CONCLUSION}" = "failure" ]; then
            echo "name=kernel" >> "${GITHUB_OUTPUT}"
        else
            echo "No failed tests. Should not reach this point."
            exit 1
        fi
      shell: sh
    - name: Collect Kernel Diagnostics
      id: kernel-diag
      if: always()
      run: |
        {
            echo "=== uname -a";                   uname -a
            echo "=== nproc";                      nproc
            echo "=== kernel taint";               cat /proc/sys/kernel/tainted || true
            echo "=== unprivileged_bpf_disabled";  sysctl -n kernel.unprivileged_bpf_disabled || true
            echo "=== dmesg (tail 300)";           dmesg | tail -300 || true
            echo "=== registered kprobes";         cat /sys/kernel/debug/kprobes/list 2> /dev/null || true
        } > /tmp/e2e-kernel-diag.log 2>&1
        # A kernel crash on the runner can invalidate test results in ways the tests
        # themselves cannot see, so make it loud: emit a workflow warning and upload
        # the diagnostics even when every test passed.
        #
        # Example (the bug that motivated this step): on kernels missing the
        # strncpy_from_kernel_nofault() fix linked below, a page fault while tracee
        # copied a string could oops the kernel inside a kprobe handler. The dying
        # task leaked the per-CPU bpf_prog_active counter, which silently disabled
        # every kprobe-attached BPF program on that CPU until reboot - events simply
        # vanished with no error reported anywhere, and tests kept passing whenever
        # their trigger happened to run on a healthy CPU (seen on EOL Ubuntu 5.13
        # arm64, which never received the fix).
        # Kernel fix: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=8678ea06852c
        if dmesg | grep -qE "Internal error: Oops|Kernel panic|BUG:|Unable to handle kernel"; then
            echo "oops=true" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Kernel oops detected on runner::dmesg contains a kernel oops/BUG - eBPF events may have been silently lost on one or more CPUs. See e2e-kernel-diag.log in the uploaded artifacts."
        else
            echo "oops=false" >> "${GITHUB_OUTPUT}"
        fi
      shell: bash
      continue-on-error: true
    - name: Upload E2E Test Artifacts
      if: always() && (steps.failed-test.outputs.name != '' || steps.kernel-diag.outputs.oops == 'true')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-${{ steps.failed-test.outputs.name || 'kernel-oops' }}-artifacts-${{ inputs.job-name }}-${{ inputs.run-id }}-${{ inputs.run-attempt }}
        path: |
          /tmp/tracee-log-*
          /tmp/tracee-output-*
          /tmp/e2e-*.log
        retention-days: 7
        if-no-files-found: warn
    - name: Notify About Available E2E Test Artifacts
      if: always() && steps.failed-test.outputs.name != ''
      env:
        FAILED_TEST: ${{ steps.failed-test.outputs.name }}
        JOB_NAME: ${{ inputs.job-name }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
      run: |
        echo "::notice title=Debug Artifacts Available::E2E tests failed. Debug artifacts have been uploaded and can be downloaded from the Summary tab. Look for: e2e-${FAILED_TEST}-artifacts-${JOB_NAME}-${RUN_ID}-${RUN_ATTEMPT}"
        echo ""
        echo "E2E Test Failed - Debug Information Available"
        echo ""
        echo "How to access debug artifacts:"
        echo "1. Click on the 'Summary' tab above the jobs list"
        echo "2. Scroll to the bottom of the Summary page"
        echo "3. Look for the 'Artifacts' section"
        echo "4. Download: e2e-${FAILED_TEST}-artifacts-${JOB_NAME}-${RUN_ID}-${RUN_ATTEMPT}"
        echo ""
        echo "What's included in the artifacts:"
        echo "- Log file: Full debug-level logs from all E2E tests (tracee-log-*)"
        echo "- Output file: JSON events captured during all E2E tests (tracee-output-*)"
        echo "- Pipeline log: Complete stdout/stderr from the failed test (e2e-*.log)"
        echo "- Kernel diagnostics: dmesg tail, taint, kprobes list (e2e-kernel-diag.log)"
        echo ""
        echo "Note: Artifacts are available for 7 days from upload"
      shell: sh
    - name: Cleanup E2E Test Artifacts
      if: always()
      run: |
        rm -f /tmp/tracee-log-* /tmp/tracee-output-* /tmp/e2e-*.log 2> /dev/null || true
        echo "Cleaned up local artifact files from all E2E tests"
      shell: sh
