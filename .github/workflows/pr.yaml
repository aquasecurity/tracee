#
# When a PR is opened or updated: Run Tracee Tests
#
name: PR

on:
  workflow_call:
    inputs:
      tracee_ref:
        description: "Tracee ref to checkout"
        required: false
        default: "main"
        type: string
      upstream_libbpfgo:
        description: "Use upstream libbpfgo (main branch) instead of pinned version"
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      tracee_ref:
        description: "Tracee ref to checkout"
        required: true
        default: "main"
        type: string
      upstream_libbpfgo:
        description: "Use upstream libbpfgo (main branch) instead of pinned version"
        required: false
        default: false
        type: boolean

  pull_request:
    branches:
      - "main"
      - "release-v*.*"
    paths:
      - "!docs/**"
      - "!deploy/**"
      - "!packaging/**"
      - "!**.yaml"
      - "!**.md"
      - "!**.txt"
      - "!**.conf"
      # override previous rules:
      - "docs/docs/flags/**"
      - "docs/man/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "**.c"
      - "**.h"
      - "**.go"
      - "**.sh"
      - "**/pr.yaml"
      - "**/action.yaml"
      - "!.cursor/**"

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRACEE_REF: ${{ inputs.tracee_ref || github.event.inputs.tracee_ref || github.ref }}
  # Go 1.26 randomizes the heap base address, breaking the eBPF stack_pivot
  # detector's Go heap recognition (see plans/tracee/stack-pivot-go126-issue.md).
  GOEXPERIMENT: norandomizedheapbase64
  TESTS: >
    TRC-102
    TRC-103
    TRC-104
    TRC-105
    TRC-107
    TRC-1010
    TRC-1014
    TRC-1016
    TRC-1018
    TRC-1022
  ARM64_TESTS: >
    TRC-102
    TRC-103
    TRC-104
    TRC-105
    TRC-107
    TRC-1010
    TRC-1014
    TRC-1016
    TRC-1018
  NETTESTS: >
    IPv4
    IPv6
    TCP
    UDP
    ICMP
    ICMPv6
    DNS
    HTTP
    HTTPRequest
    HTTPResponse

jobs:

  debug-runner-label:
    name: Debug Runner Label
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    steps:
      - name: Debug Runner Label
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          RUNNER_LABEL: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
        run: |
          echo "Repository owner: ${REPO_OWNER}"
          echo "Runner label: ${RUNNER_LABEL}"

  #
  # BUILD ENVIRONMENT IMAGE (built once per arch, cached for all other jobs)
  #

  build-buildenv:
    name: Build Build Environment (x86_64)
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TRACEE_REF }}

      - name: Build Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

  build-buildenv-arm64:
    name: Build Build Environment (ARM64)
    runs-on: ${{ vars.UBUNTU_ARM64_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04-arm') }}
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TRACEE_REF }}

      - name: Build Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

  #
  # DOC VERIFICATION
  #

  verify-docs:
    name: Verify Documentation
    if: inputs.upstream_libbpfgo != true
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRACEE_REF }}

      - name: Ensure updates of *.1.md and *.1 pairs
        run: |
          ./scripts/verify_man_md_sync.sh --base-ref origin/main --fetch-depth 1

  #
  # CODE VERIFICATION
  #

  verify-analyze-code:
    name: Verify and Analyze Code
    if: inputs.upstream_libbpfgo != true
    needs:
      - build-buildenv
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    env:
      TRACEE_HOST_GOMODCACHE: /tmp/go-mod
      TRACEE_HOST_GOCACHE: /tmp/go-cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}

      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRACEE_HOST_GOMODCACHE }}
            ${{ env.TRACEE_HOST_GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-

      - name: Prepare Go cache dirs
        run: |
          mkdir -p "${TRACEE_HOST_GOMODCACHE}" "${TRACEE_HOST_GOCACHE}"

      - name: Lint (Revive)
        run: |
          make check-lint

      - name: Check Code Style
        run: |
          make check-fmt

      - name: Check Golang Vet
        run: |
          make check-vet

      - name: Check with StaticCheck
        run: |
          make check-staticcheck

      - name: Check with errcheck
        run: |
          make check-err

      # govulncheck is advisory-only here: on findings the step exits non-zero (so it shows as
      # failed and its report stays visible), while `continue-on-error` keeps that failure from
      # blocking the jobs that need verify-analyze-code - unit/integration/etc. still run. The
      # report is surfaced as a non-blocking hint in the job summary. Resolve by bumping the flagged
      # dependency once a fixed release is available.
      - name: Check with govulncheck (advisory, non-blocking)
        continue-on-error: true
        run: |
          set +e
          log=/tmp/govulncheck.log
          make check-vulncheck > "${log}" 2>&1
          rc=$?
          cat "${log}"
          if [ "${rc}" -ne 0 ]; then
              echo "::warning title=govulncheck (advisory, non-blocking)::Findings reported; PR checks still run. Bump the flagged dependency once a fixed release exists."
              {
                  echo "### govulncheck: advisory hint (non-blocking)"
                  echo ""
                  echo "govulncheck reported findings. This does NOT block the unit, integration, or"
                  echo "other jobs. Resolve by bumping the flagged dependency once a fixed release exists."
                  echo ""
                  echo '```'
                  tail -n 60 "${log}"
                  echo '```'
              } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"

  #
  # TOOLS BUILD VERIFICATION
  #

  verify-tools:
    name: Verify Other Tools
    if: inputs.upstream_libbpfgo != true
    needs:
      - verify-analyze-code
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    env:
      TRACEE_HOST_GOMODCACHE: /tmp/go-mod
      TRACEE_HOST_GOCACHE: /tmp/go-cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}

      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRACEE_HOST_GOMODCACHE }}
            ${{ env.TRACEE_HOST_GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-

      - name: Prepare Go cache dirs
        run: |
          mkdir -p "${TRACEE_HOST_GOMODCACHE}" "${TRACEE_HOST_GOCACHE}"

      - name: Build Tracee Benchmark Tool
        run: |
          make clean
          make tracee-bench

  #
  # CODE TESTS
  #

  unit-tests:
    name: Unit Tests (x86_64)
    if: ${{ !cancelled() && !failure() }}
    needs:
      - build-buildenv
      - verify-analyze-code
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    env:
      TRACEE_HOST_GOMODCACHE: /tmp/go-mod
      TRACEE_HOST_GOCACHE: /tmp/go-cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}
          fetch-depth: 0

      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRACEE_HOST_GOMODCACHE }}
            ${{ env.TRACEE_HOST_GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-

      - name: Prepare Go cache dirs
        run: |
          mkdir -p "${TRACEE_HOST_GOMODCACHE}" "${TRACEE_HOST_GOCACHE}"

      - name: Run Unit Tests
        uses: ./.github/actions/run-unit-tests

  unit-tests-arm64:
    name: Unit Tests (ARM64)
    if: ${{ !cancelled() && !failure() }}
    needs:
      - build-buildenv-arm64
      - verify-analyze-code
    runs-on: ${{ vars.UBUNTU_ARM64_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04-arm') }}
    permissions:
      contents: read
    env:
      TRACEE_HOST_GOMODCACHE: /tmp/go-mod
      TRACEE_HOST_GOCACHE: /tmp/go-cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}
          fetch-depth: 0

      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRACEE_HOST_GOMODCACHE }}
            ${{ env.TRACEE_HOST_GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-

      - name: Prepare Go cache dirs
        run: |
          mkdir -p "${TRACEE_HOST_GOMODCACHE}" "${TRACEE_HOST_GOCACHE}"

      - name: Run Unit Tests
        uses: ./.github/actions/run-unit-tests

  #
  # INTEGRATION TESTS
  #

  integration-tests:
    name: Integration Tests (x86_64)
    if: ${{ !cancelled() && !failure() }}
    needs:
      - verify-analyze-code
    runs-on:
      # Ubuntu 24.04 generic (6.11.0-29) [x86_64]
      - graas_ami-03dbff05cae3a30d0_${{ github.event.number || 0 }}${{ github.run_attempt }}-${{ github.run_id }}
      - EXECUTION_TYPE=SHORT
      - INSTANCE_TYPE=MEDIUM
    permissions:
      contents: read
    env:
      HOME: "/tmp/root"
      GOPATH: "/tmp/go"
      GOCACHE: "/tmp/go-cache"
      GOROOT: "/usr/local/go"
      # the containerized make mounts these as the in-container Go caches
      TRACEE_HOST_GOMODCACHE: "/tmp/go/pkg/mod"
      TRACEE_HOST_GOCACHE: "/tmp/go-cache"
      # integration tests exercise the userland too (coreutils paths, PAM
      # files, glibc ldd): use the ubuntu build environment
      DISTRO: "ubuntu"
    steps:
      - name: Prepare Environment
        run: |
          mkdir -p "${HOME}" "${GOPATH}" "${GOCACHE}" "${TRACEE_HOST_GOMODCACHE}"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}
          fetch-depth: 0

      # Restores the buildenv image from the actions cache or builds it
      # (GRAAS instances are ephemeral; the uid-keyed cache entry is
      # populated by the first integration run, not by build-buildenv).
      # Integration tests use the ubuntu environment: they exercise the
      # userland too (coreutils paths, PAM files, glibc ldd)
      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv
        with:
          distro: ubuntu

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOPATH }}/pkg/mod
            ${{ env.GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-

      - name: Pull test images
        uses: ./.github/actions/pull-test-images

      - name: Run Integration Tests
        uses: ./.github/actions/run-integration-tests

  integration-tests-arm64:
    name: Integration Tests (ARM64)
    if: ${{ !cancelled() && !failure() }}
    needs:
      - verify-analyze-code
    runs-on:
      # Ubuntu 24.04 generic (6.11.0-29) [aarch64]
      - graas_ami-07774797557132122_${{ github.event.number || 0 }}${{ github.run_attempt }}-${{ github.run_id }}
      - EXECUTION_TYPE=SHORT
      - INSTANCE_TYPE=MEDIUM
    permissions:
      contents: read
    env:
      HOME: "/tmp/root"
      GOPATH: "/tmp/go"
      GOCACHE: "/tmp/go-cache"
      GOROOT: "/usr/local/go"
      # the containerized make mounts these as the in-container Go caches
      TRACEE_HOST_GOMODCACHE: "/tmp/go/pkg/mod"
      TRACEE_HOST_GOCACHE: "/tmp/go-cache"
      # integration tests exercise the userland too (coreutils paths, PAM
      # files, glibc ldd): use the ubuntu build environment
      DISTRO: "ubuntu"
    steps:
      - name: Prepare Environment
        run: |
          mkdir -p "${HOME}" "${GOPATH}" "${GOCACHE}" "${TRACEE_HOST_GOMODCACHE}"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}
          fetch-depth: 0

      # Restores the buildenv image from the actions cache or builds it
      # (GRAAS instances are ephemeral; the uid-keyed cache entry is
      # populated by the first integration run, not by build-buildenv).
      # Integration tests use the ubuntu environment: they exercise the
      # userland too (coreutils paths, PAM files, glibc ldd)
      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv
        with:
          distro: ubuntu

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOPATH }}/pkg/mod
            ${{ env.GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-

      - name: Pull test images
        uses: ./.github/actions/pull-test-images

      - name: Run Integration Tests
        uses: ./.github/actions/run-integration-tests

  #
  # PERFORMANCE TESTS
  #

  performance-tests:
    name: Performance Tests
    if: ${{ !cancelled() && !failure() }}
    needs:
      - build-buildenv
      - verify-analyze-code
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    env:
      TRACEE_HOST_GOMODCACHE: /tmp/go-mod
      TRACEE_HOST_GOCACHE: /tmp/go-cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}

      - name: Build Environment Image
        uses: ./.github/actions/build-tracee-buildenv

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.TRACEE_HOST_GOMODCACHE }}
            ${{ env.TRACEE_HOST_GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-alpine-${{ hashFiles('**/go.mod') }}-

      - name: Prepare Go cache dirs
        run: |
          mkdir -p "${TRACEE_HOST_GOMODCACHE}" "${TRACEE_HOST_GOCACHE}"

      # make test-performance runs in the privileged buildenv container
      # (--pid=host --privileged, engine socket mounted) via the Makefile
      - name: Run Performance Tests
        run: |
          make test-performance

  #
  # FUNCTIONAL TESTS AGAINST DIFFERENT KERNELS
  #

  generate-matrix:
    name: Generate Test Matrix
    runs-on: ${{ vars.UBUNTU_X86_RUNNER_LABEL || (github.repository_owner == 'aquasecurity' && 'ubuntu-24.04') }}
    permissions:
      contents: read
    outputs:
      matrix01: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRACEE_REF }}

      - name: Generate Matrix
        id: generate
        uses: ./.github/actions/generate-kernel-matrix

  kernel-tests:
    name: ${{ matrix.job_name }}
    needs:
      - generate-matrix
    runs-on:
      - graas_ami-${{ matrix.ami }}_${{ github.event.number || 0 }}${{ github.run_attempt }}-${{ github.run_id }}_${{ matrix.sufix }}
      - EXECUTION_TYPE=LONG
      - INSTANCE_TYPE=XLARGE
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.generate-matrix.outputs.matrix01)}}
    env:
      HOME: "/tmp/root"
      GOPATH: "/tmp/go"
      GOCACHE: "/tmp/go-cache"
      GOROOT: "/usr/local/go"
      # kernel tests stay bare-host: the AMIs exist to exercise old distro
      # kernels with minimal indirection and are pre-baked with the toolchain
      NATIVE: "1"
    steps:
      - name: Prepare Environment
        run: |
          mkdir -p "${HOME}" "${GOPATH}" "${GOCACHE}"

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOPATH }}/pkg/mod
            ${{ env.GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-

      - name: "System Info"
        run: ./scripts/system-info.sh --all

      - name: "Environment Variables"
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          ARM64_TESTS_VALUE: ${{ env.ARM64_TESTS }}
        run: |
          if [ "${MATRIX_ARCH}" = "aarch64" ]; then
              echo "TESTS=${ARM64_TESTS_VALUE}" >> "${GITHUB_ENV}"
          fi
          LINUX_ID=$(grep -Pom1 '^ID=\K.*' /etc/os-release)
          echo "LINUX_ID=${LINUX_ID}" >> "${GITHUB_ENV}"
          VERSION_CODENAME=$(grep -Pom1 '^VERSION_CODENAME=\K.*' /etc/os-release 2> /dev/null || echo "")
          echo "VERSION_CODENAME=${VERSION_CODENAME}" >> "${GITHUB_ENV}"
        shell: bash

      - name: "Disable Unattended Upgrades (Ubuntu only)"
        if: ${{ env.LINUX_ID == 'ubuntu' }}
        run: ./scripts/disable-unattended-upgrades.sh --timeout 5
        continue-on-error: true

      # NOTE: To remove when AMIs are updated accordingly.
      - name: "Fix EOL Ubuntu Repositories (Lunar/Mantic)"
        if: ${{ env.LINUX_ID == 'ubuntu' && (env.VERSION_CODENAME == 'lunar' || env.VERSION_CODENAME == 'mantic') }}
        run: |
          set -e
          ARCH=$(uname -m)
          if [[ "${ARCH}" == "aarch64" ]] || [[ "${ARCH}" == "arm64" ]]; then
              sed -i 's|http://.*ports\.ubuntu\.com/ubuntu-ports|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
              sed -i 's|http://.*\.ec2\.ports\.ubuntu\.com/ubuntu-ports|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
              sed -i 's|http://.*ec2\.ports\.ubuntu\.com/ubuntu-ports|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          else
              sed -i 's|http://.*archive\.ubuntu\.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
              sed -i 's|http://security\.ubuntu\.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          fi
        shell: bash
        continue-on-error: true

      # NOTE: Use this step when AMIs are not updated with the latest tooling.
      # Comment it after new AMIs are released.
      - name: "Install Tooling"
        id: install-tooling
        run: |
          ./scripts/installation/install-clang.sh

      # NOTE: Show Tooling Info again to verify on-the-fly changes made during workflow execution.
      - name: "Tooling Info (After Installations and Configurations)"
        if: always() && steps.install-tooling.outcome == 'success'
        run: ./scripts/system-info.sh --tooling

      - name: Pull test images
        uses: ./.github/actions/pull-test-images

      - name: "Sync System Time"
        run: ./scripts/sync_system_time.sh
        continue-on-error: true

      - name: "Run E2E Tests"
        uses: ./.github/actions/run-e2e-tests
        with:
          job-name: ${{ matrix.job_name }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

  #
  # KERNEL-TAMPERING E2E TESTS (VM: Firecracker/KVM or QEMU/TCG)
  #
  # The two core tests that build+insmod a real kernel module and read host
  # dmesg (FTRACE_HOOK, HOOKED_SYSCALL) self-skip in the containerized
  # test-e2e (containers share the host kernel). Here they run for real inside
  # a throwaway VM, so a mistaken module or a leaked rmmod never touches the
  # runner's kernel. Firecracker when the runner has /dev/kvm, else QEMU/TCG.
  #
  # Arch is a matrix so adding one is a single entry, not a duplicated job.
  # Only x86_64 is enabled today: the test modules and the syscall-table hook
  # are x86-specific. The arm64 entry is authored but commented out (below).
  #
  kernel-tests-vm:
    name: Kernel Tampering Tests (VM, ${{ matrix.arch }})
    # Independent kernel coverage, exactly like the kernel-tests AMI matrix:
    # this answers "does tracee work against a real kernel", not "does the code
    # lint", so it is deliberately NOT gated on verify-analyze-code (a red lint
    # must not skip the VM tier). It builds its own ubuntu-fc image via 'make
    # image-fc' and needs nothing from any other job, so it carries no 'needs'.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 generic (6.11.0-29) [x86_64] - KVM-capable GRAAS AMI.
          - arch: x86_64
            ami: 03dbff05cae3a30d0
            execution_type: LONG
            instance_type: LARGE
          # arm64: AUTHORED BUT DISABLED. The job body below is already
          # arch-agnostic and the image machinery is arm64-ready
          # (install-firecracker.sh is arch-aware, the aarch64 firecracker
          # checksum is vendored), so the missing piece is arm64 TEST CONTENT,
          # not CI wiring. To enable:
          #   1. Add arm64 equivalents of the two kernel modules and drop the
          #      aarch64 skips in tests/e2e/lib-core.sh.
          #   2. Relax the x86_64 guards in scripts/e2e-firecracker.sh and the
          #      test-e2e-vm target in mk/tracee.mk to also accept aarch64.
          #   3. Uncomment the entry below with a real KVM-capable arm64 GRAAS
          #      AMI id.
          # - arch: arm64
          #   ami: <ARM64_KVM_AMI_ID>
          #   execution_type: LONG
          #   instance_type: LARGE
    runs-on:
      # The trailing _fcvm keeps this label distinct from integration-tests,
      # which provisions off the same AMI id with the same run suffix; GRAAS
      # spins up one ephemeral runner per unique label, so without a suffix the
      # two jobs collide on a single single-use runner and this one hangs on
      # "Waiting for a runner to pick up this job" (the kernel-tests matrix does
      # the same with its own per-entry token).
      - graas_ami-${{ matrix.ami }}_${{ github.event.number || 0 }}${{ github.run_attempt }}-${{ github.run_id }}_fcvm
      - EXECUTION_TYPE=${{ matrix.execution_type }}
      - INSTANCE_TYPE=${{ matrix.instance_type }}
    permissions:
      contents: read
    env:
      HOME: "/tmp/root"
      GOPATH: "/tmp/go"
      GOCACHE: "/tmp/go-cache"
      GOROOT: "/usr/local/go"
      # the containerized make mounts these as the in-container Go caches
      TRACEE_HOST_GOMODCACHE: "/tmp/go/pkg/mod"
      TRACEE_HOST_GOCACHE: "/tmp/go-cache"
    steps:
      - name: Prepare Environment
        run: |
          mkdir -p "${HOME}" "${GOPATH}" "${GOCACHE}" "${TRACEE_HOST_GOMODCACHE}"

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          ref: ${{ env.TRACEE_REF }}
          fetch-depth: 0

      - name: "System Info"
        run: ./scripts/system-info.sh --all
        continue-on-error: true

      - name: Swap to upstream libbpfgo
        if: inputs.upstream_libbpfgo == true
        uses: ./.github/actions/swap-upstream-libbpfgo

      - name: Cache Go modules
        if: inputs.upstream_libbpfgo != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOPATH }}/pkg/mod
            ${{ env.GOCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-graas-${{ hashFiles('**/go.mod') }}-

      # the VM boots the runner host's OWN kernel and compiles the test
      # module against its build headers; this AMI's normal workload never
      # builds modules, so the headers may be absent. Install them (best-effort
      # - a pre-baked AMI already has them; if they are genuinely unavailable
      # the runner skips with a clear message instead of building nothing).
      - name: Install kernel headers
        run: sudo apt-get update && sudo apt-get install -y "linux-headers-$(uname -r)"
        continue-on-error: true

      # opt-in VM-capable buildenv (firecracker + qemu + ext4/rsync tooling; no
      # kernel is bundled - the runner boots the host's running kernel). Restored
      # from the actions cache keyed by the Containerfile + install scripts; only
      # a cache miss pays the firecracker+qemu+tooling build, which on a fresh
      # ephemeral runner is far slower than loading the cached image.
      - name: Build FC Environment Image
        uses: ./.github/actions/build-tracee-buildenv
        with:
          fc: 'true'

      - name: Run Kernel Tampering Tests (VM)
        id: e2e-vm
        run: |
          make test-e2e-vm 2>&1 | tee /tmp/e2e-test-vm.log
          rc=${PIPESTATUS[0]}
          # a skip exits 0; surface it so a green check is not mistaken for
          # "tests ran" (e.g. kernel not bootable, or headers unavailable)
          if grep -q '\[e2e-vm\] SKIP:' /tmp/e2e-test-vm.log; then
            echo "::warning title=VM tests skipped::Kernel-tampering VM tests did not run - see the SKIP line in the log."
          fi
          exit "${rc}"
        shell: bash

      - name: Upload VM E2E Artifacts
        if: always() && steps.e2e-vm.conclusion == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-vm-artifacts-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/tracee/e2e-artifacts/**
            /tmp/e2e-test-vm.log
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup Artifacts
        if: always()
        run: |
          rm -rf /tmp/tracee/e2e-artifacts /tmp/e2e-test-vm.log 2> /dev/null || true
